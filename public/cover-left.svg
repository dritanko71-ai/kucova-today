<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
    <defs>
        <linearGradient id="ph" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fdf8ec"/>
            <stop offset="100%" stop-color="#eeddb4"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#DBB764"/>
            <stop offset="100%" stop-color="#b8933f"/>
        </linearGradient>
    </defs>

    <rect width="300" height="400" fill="#ffffff"/>

    <!-- Masthead -->
    <rect x="0" y="0" width="300" height="5" fill="url(#gold)"/>
    <text x="150" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" letter-spacing="5" fill="#2D2D2D">JETOBUKUR</text>
    <text x="150" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#8a6d2f">Revistë shqiptare &middot; Ushqim &amp; Shëndet</text>
    <line x1="22" y1="92" x2="278" y2="92" stroke="#DBB764" stroke-width="1.5"/>
    <line x1="22" y1="96" x2="278" y2="96" stroke="#E7D6A9" stroke-width="1"/>

    <!-- Cover image -->
    <rect x="22" y="112" width="256" height="150" rx="4" fill="url(#ph)"/>
    <circle cx="150" cy="175" r="44" fill="#ffffff" opacity="0.92"/>
    <g transform="translate(150 175)">
        <!-- Cake -->
        <rect x="-34" y="8" width="68" height="22" rx="3" fill="#D9A65B"/>
        <rect x="-34" y="8" width="68" height="7" rx="3" fill="#EFC98C"/>
        <rect x="-27" y="-6" width="54" height="16" rx="3" fill="#E8B97A"/>
        <rect x="-27" y="-6" width="54" height="5" rx="3" fill="#F5D9A8"/>
        <path d="M-15 -6 L-9 -20 L-3 -6 Z" fill="#E05A4E"/>
        <path d="M3 -6 L9 -20 L15 -6 Z" fill="#E05A4E"/>
        <circle cx="-9" cy="-26" r="3" fill="#F5D9A8"/>
        <circle cx="9" cy="-26" r="3" fill="#F5D9A8"/>
        <path d="M-34 30 Q-8 42 18 30 Q38 30 34 34 L34 38 Q-10 48 -34 36 Z" fill="#F2F2F2"/>
        <line x1="-34" y1="34" x2="34" y2="34" stroke="#D8D8D8" stroke-width="1"/>
    </g>

    <!-- Cover lines -->
    <g font-family="Georgia, 'Times New Roman', serif">
        <rect x="22" y="276" width="256" height="40" rx="3" fill="#2D2D2D"/>
        <text x="150" y="292" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">RECETA T&#203; SHIJSHME</text>
        <text x="150" y="308" text-anchor="middle" font-size="10" fill="#E7D6A9">p&#235;r &#231;do dit&#235; t&#235; jav&#235;s</text>

        <text x="22" y="336" font-size="11" font-weight="bold" fill="#2D2D2D">&#9670; Ëmbëlsira pa sheqer</text>
        <text x="22" y="354" font-size="11" font-weight="bold" fill="#2D2D2D">&#9670; Darka t&#235; shpejta dhe t&#235; shijshme</text>
    </g>

    <!-- Bottom bar -->
    <line x1="22" y1="368" x2="278" y2="368" stroke="#E7D6A9" stroke-width="1"/>
    <text x="22" y="387" font-family="Georgia, 'Times New Roman', serif" font-size="8.5" fill="#8a6d2f" letter-spacing="1">NR. 7 &middot; KORRIK 2026</text>
    <text x="150" y="387" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" font-style="italic" fill="#545454">&#8364;2.50</text>
    <g transform="translate(248 374)" fill="#2D2D2D">
        <rect x="0" y="0" width="2" height="13"/>
        <rect x="4" y="0" width="2" height="13"/>
        <rect x="8" y="0" width="2" height="13"/>
        <rect x="12" y="0" width="2" height="13"/>
        <rect x="16" y="0" width="2" height="13"/>
        <rect x="20" y="0" width="2" height="13"/>
        <rect x="24" y="0" width="2" height="13"/>
        <rect x="28" y="0" width="2" height="13"/>
    </g>
</svg>
