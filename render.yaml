services:
  - type: web
    name: jetobukur
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/articles
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: PUBLIC_URL
        value: https://jetobukur.onrender.com
